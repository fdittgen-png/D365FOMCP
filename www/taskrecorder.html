<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D365FO Task Recording Parser</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --blue: #0078d4;
            --blue-dark: #106ebe;
            --blue-light: #deecf9;
            --green: #107c10;
            --green-bg: #dff6dd;
            --red: #d13438;
            --red-bg: #fde7e9;
            --yellow-bg: #fff4ce;
            --gray-10: #faf9f8;
            --gray-20: #f3f2f1;
            --gray-40: #e1dfdd;
            --gray-60: #b3b0ad;
            --gray-90: #605e5c;
            --gray-130: #323130;
            --gray-160: #201f1e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0078d4 0%, #004578 100%);
            min-height: 100vh;
            padding: 0;
            color: var(--gray-130);
        }

        /* ── Header ──────────────────────────────────────────────── */
        header {
            background: rgba(0, 0, 0, 0.15);
            color: white;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { font-size: 18px; font-weight: 600; }
        header .version { font-size: 12px; opacity: 0.7; }

        /* ── Layout ──────────────────────────────────────────────── */
        .container { max-width: 1000px; margin: 0 auto; padding: 24px; }

        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            padding: 24px 28px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--gray-130);
            margin-bottom: 16px;
        }

        /* ── Config bar ──────────────────────────────────────────── */
        .config-bar {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .config-group { display: flex; flex-direction: column; flex: 1; min-width: 280px; }
        .config-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-130);
            margin-bottom: 4px;
        }
        input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #8a8886;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--blue); }
        input[type="text"]::placeholder { color: #a19f9d; }

        /* ── Buttons ─────────────────────────────────────────────── */
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--blue); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: var(--blue-dark); }
        .btn-secondary { background: var(--gray-20); color: var(--gray-130); }
        .btn-secondary:hover:not(:disabled) { background: var(--gray-40); }
        .btn-success { background: var(--green); color: #fff; }
        .btn-success:hover:not(:disabled) { background: #0b6a0b; }
        .btn-small { padding: 6px 14px; font-size: 12px; }

        .btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        /* ── Drop zone ───────────────────────────────────────────── */
        .drop-zone {
            border: 2px dashed var(--gray-40);
            border-radius: 8px;
            padding: 44px 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: var(--gray-10);
        }
        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--blue);
            background: var(--blue-light);
        }
        .drop-zone-icon { font-size: 40px; margin-bottom: 8px; }
        .drop-zone-text { font-size: 14px; color: var(--gray-90); }
        .drop-zone-text strong { color: var(--blue); cursor: pointer; }
        .drop-zone input[type="file"] { display: none; }

        /* ── File info ───────────────────────────────────────────── */
        .file-info {
            display: none;
            background: white;
            border: 1px solid var(--gray-40);
            border-radius: 8px;
            padding: 14px 16px;
            margin-top: 14px;
            align-items: center;
            gap: 12px;
        }
        .file-info.visible { display: flex; }
        .file-icon { font-size: 26px; }
        .file-details { flex: 1; }
        .file-name { font-weight: 600; font-size: 14px; }
        .file-size { color: var(--gray-90); font-size: 12px; }
        .file-remove {
            background: none; border: none; color: var(--red);
            cursor: pointer; font-size: 20px; padding: 4px 8px;
        }

        /* ── Stats bar ───────────────────────────────────────────── */
        .stats-bar {
            display: none;
            gap: 32px;
            flex-wrap: wrap;
            padding: 16px 20px;
            background: var(--gray-10);
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .stats-bar.visible { display: flex; }
        .stat { text-align: center; }
        .stat-value { font-size: 26px; font-weight: 700; color: var(--blue); }
        .stat-label { font-size: 11px; color: var(--gray-90); text-transform: uppercase; letter-spacing: 0.5px; }

        /* ── Tabs ────────────────────────────────────────────────── */
        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--gray-40);
            margin-bottom: 16px;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-90);
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
            background: none;
            font-family: inherit;
        }
        .tab:hover { color: var(--blue); }
        .tab.active { color: var(--blue); border-bottom-color: var(--blue); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ── Output ──────────────────────────────────────────────── */
        .output-raw {
            background: var(--gray-10);
            border: 1px solid var(--gray-40);
            border-radius: 6px;
            padding: 16px;
            font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 65vh;
            overflow-y: auto;
            tab-size: 2;
        }
        .output-rendered {
            max-height: 65vh;
            overflow-y: auto;
            padding: 4px 0;
        }
        .output-rendered h1 { font-size: 22px; color: var(--blue); margin: 16px 0 8px; border-bottom: 2px solid var(--blue-light); padding-bottom: 6px; }
        .output-rendered h2 { font-size: 17px; color: var(--gray-130); margin: 20px 0 8px; border-bottom: 1px solid var(--gray-40); padding-bottom: 4px; }
        .output-rendered h3 { font-size: 14px; color: var(--gray-130); margin: 14px 0 6px; }
        .output-rendered table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0 16px; }
        .output-rendered th { text-align: left; padding: 8px 10px; background: var(--gray-20); border: 1px solid var(--gray-40); font-weight: 600; font-size: 12px; }
        .output-rendered td { padding: 6px 10px; border: 1px solid var(--gray-40); font-size: 13px; }
        .output-rendered tr:hover td { background: var(--gray-10); }
        .output-rendered blockquote { border-left: 3px solid var(--blue); padding: 6px 14px; margin: 8px 0; background: var(--blue-light); border-radius: 0 4px 4px 0; font-size: 14px; }
        .output-rendered ul { padding-left: 20px; margin: 4px 0 10px; }
        .output-rendered li { margin: 2px 0; font-size: 13px; }
        .output-rendered code { background: var(--gray-20); padding: 1px 5px; border-radius: 3px; font-size: 12px; font-family: 'Cascadia Code', 'Consolas', monospace; }
        .output-rendered pre { background: var(--gray-10); border: 1px solid var(--gray-40); border-radius: 6px; padding: 14px; overflow-x: auto; margin: 8px 0; }
        .output-rendered pre code { background: none; padding: 0; font-size: 12px; }
        .output-rendered hr { border: none; border-top: 1px solid var(--gray-40); margin: 16px 0; }
        .output-rendered p { margin: 4px 0; font-size: 13px; line-height: 1.5; }
        .output-rendered em { color: var(--gray-90); }

        /* ── Trace console ───────────────────────────────────────── */
        .trace-console {
            display: none;
            background: var(--gray-160);
            color: #d4d4d4;
            border-radius: 6px;
            padding: 14px 16px;
            font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.7;
            max-height: 200px;
            overflow-y: auto;
        }
        .trace-console.visible { display: block; }
        .trace-method { color: #569cd6; font-weight: 600; }
        .trace-url { color: #ce9178; }
        .trace-status-ok { color: #4ec9b0; }
        .trace-status-err { color: #f44747; }
        .trace-dim { color: #808080; }
        .trace-info { color: #dcdcaa; }

        /* ── Loading ─────────────────────────────────────────────── */
        .spinner-inline {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Messages ────────────────────────────────────────────── */
        .message {
            display: none;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 13px;
            margin-top: 12px;
        }
        .message.visible { display: block; }
        .message.error { background: var(--red-bg); color: #a4262c; border-left: 4px solid var(--red); }
        .message.success { background: var(--green-bg); color: #0b6a0b; border-left: 4px solid var(--green); }

        /* ── Responsive ──────────────────────────────────────────── */
        @media (max-width: 600px) {
            .container { padding: 16px 12px; }
            .card { padding: 16px; }
            .stats-bar { gap: 16px; }
            .stat-value { font-size: 20px; }
        }
    </style>
</head>
<body>

<header>
    <h1>D365FO Task Recording Parser</h1>
    <span class="version">MCP Service v1.0</span>
</header>

<div class="container">

    <!-- ── Config ──────────────────────────────────────────────── -->
    <div class="card">
        <div class="config-bar">
            <div class="config-group">
                <label for="apiUrl">Function App URL</label>
                <input type="text" id="apiUrl" placeholder="https://your-func.azurewebsites.net">
            </div>
            <div class="config-group" style="flex:0; min-width:auto;">
                <label>&nbsp;</label>
                <button class="btn btn-secondary btn-small" id="btnHealth" title="Check service health">Test</button>
            </div>
        </div>
        <div id="healthMsg" class="message" style="margin-top:10px"></div>
    </div>

    <!-- ── Upload ──────────────────────────────────────────────── -->
    <div class="card">
        <div class="card-title">Upload Task Recording</div>

        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">&#128203;</div>
            <p class="drop-zone-text">
                Drag &amp; drop an <strong>.axtr</strong> file here, or <strong>click to browse</strong>
            </p>
            <input type="file" id="fileInput" accept=".axtr,.xml">
        </div>

        <div class="file-info" id="fileInfo">
            <span class="file-icon">&#128196;</span>
            <div class="file-details">
                <div class="file-name" id="fileName"></div>
                <div class="file-size" id="fileSize"></div>
            </div>
            <button class="file-remove" id="fileRemove" title="Remove file">&times;</button>
        </div>

        <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-primary" id="btnParse" disabled>Parse Recording</button>
        </div>

        <div id="parseMsg" class="message"></div>
    </div>

    <!-- ── Results ─────────────────────────────────────────────── -->
    <div class="card" id="resultsCard" style="display:none">
        <div class="stats-bar visible" id="statsBar">
            <div class="stat"><div class="stat-value" id="statName">-</div><div class="stat-label">Recording</div></div>
            <div class="stat"><div class="stat-value" id="statSteps">-</div><div class="stat-label">Steps</div></div>
            <div class="stat"><div class="stat-value" id="statForms">-</div><div class="stat-label">Forms</div></div>
            <div class="stat"><div class="stat-value" id="statSecurity">-</div><div class="stat-label">Security Roles</div></div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="rendered">Rendered Preview</button>
            <button class="tab" data-tab="raw">Raw Markdown</button>
        </div>

        <div class="tab-panel active" id="tab-rendered">
            <div class="output-rendered" id="outputRendered"></div>
        </div>
        <div class="tab-panel" id="tab-raw">
            <div class="output-raw" id="outputRaw"></div>
        </div>

        <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-primary btn-small" id="btnCopy">Copy Markdown</button>
            <button class="btn btn-secondary btn-small" id="btnDownload">Download .md</button>
        </div>
    </div>

    <!-- ── Trace ───────────────────────────────────────────────── -->
    <div class="card">
        <div class="card-title">HTTP Trace</div>
        <div class="trace-console visible" id="traceConsole">
            <span class="trace-dim">Ready. Upload a file to begin.</span>
        </div>
    </div>

</div>

<script>
// ══════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════
let selectedFile = null;
let lastMarkdown = '';

const LS_KEY = 'taskrecorder_apiUrl';

// ══════════════════════════════════════════════════════════════════
// DOM REFS
// ══════════════════════════════════════════════════════════════════
const apiUrlInput     = document.getElementById('apiUrl');
const btnHealth       = document.getElementById('btnHealth');
const healthMsg       = document.getElementById('healthMsg');
const dropZone        = document.getElementById('dropZone');
const fileInput       = document.getElementById('fileInput');
const fileInfo        = document.getElementById('fileInfo');
const fileNameEl      = document.getElementById('fileName');
const fileSizeEl      = document.getElementById('fileSize');
const fileRemoveBtn   = document.getElementById('fileRemove');
const btnParse        = document.getElementById('btnParse');
const parseMsg        = document.getElementById('parseMsg');
const resultsCard     = document.getElementById('resultsCard');
const outputRendered  = document.getElementById('outputRendered');
const outputRaw       = document.getElementById('outputRaw');
const btnCopy         = document.getElementById('btnCopy');
const btnDownload     = document.getElementById('btnDownload');
const traceConsole    = document.getElementById('traceConsole');

// ══════════════════════════════════════════════════════════════════
// CONFIG PERSISTENCE
// ══════════════════════════════════════════════════════════════════
function getApiUrl() {
    const v = apiUrlInput.value.trim().replace(/\/+$/, '');
    return v || window.location.origin;
}

apiUrlInput.value = localStorage.getItem(LS_KEY) || window.location.origin;
apiUrlInput.addEventListener('change', () => {
    localStorage.setItem(LS_KEY, apiUrlInput.value.trim());
});

// ══════════════════════════════════════════════════════════════════
// TRACE CONSOLE
// ══════════════════════════════════════════════════════════════════
function trace(html) {
    const ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
    traceConsole.innerHTML += `\n<span class="trace-dim">[${ts}]</span> ${html}`;
    traceConsole.scrollTop = traceConsole.scrollHeight;
}

function traceClear() {
    traceConsole.innerHTML = '';
}

function traceRequest(method, url) {
    trace(`<span class="trace-method">${method}</span> <span class="trace-url">${url}</span>`);
}

function traceResponse(status, duration, extra) {
    const cls = status < 400 ? 'trace-status-ok' : 'trace-status-err';
    let line = `<span class="${cls}">${status}</span> <span class="trace-dim">(${duration}ms)</span>`;
    if (extra) line += ` <span class="trace-info">${extra}</span>`;
    trace(line);
}

// ══════════════════════════════════════════════════════════════════
// HEALTH CHECK
// ══════════════════════════════════════════════════════════════════
btnHealth.addEventListener('click', async () => {
    const url = `${getApiUrl()}/api/d365taskrecorder`;
    healthMsg.className = 'message';
    btnHealth.disabled = true;
    traceRequest('GET', url);
    const t0 = performance.now();
    try {
        const resp = await fetch(url);
        const dur = Math.round(performance.now() - t0);
        const data = await resp.json();
        traceResponse(resp.status, dur, JSON.stringify(data));
        if (resp.ok && data.status === 'ok') {
            healthMsg.textContent = `Service is healthy: ${data.name} v${data.version}`;
            healthMsg.className = 'message visible success';
        } else {
            healthMsg.textContent = `Unexpected response: ${JSON.stringify(data)}`;
            healthMsg.className = 'message visible error';
        }
    } catch (err) {
        const dur = Math.round(performance.now() - t0);
        traceResponse(0, dur, err.message);
        healthMsg.textContent = `Connection failed: ${err.message}`;
        healthMsg.className = 'message visible error';
    } finally {
        btnHealth.disabled = false;
    }
});

// ══════════════════════════════════════════════════════════════════
// FILE SELECTION
// ══════════════════════════════════════════════════════════════════
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        onFileSelected();
    }
});
fileInput.addEventListener('change', onFileSelected);

fileRemoveBtn.addEventListener('click', () => {
    selectedFile = null;
    fileInput.value = '';
    fileInfo.classList.remove('visible');
    btnParse.disabled = true;
    parseMsg.className = 'message';
});

function onFileSelected() {
    const f = fileInput.files[0];
    if (!f) return;
    selectedFile = f;
    fileNameEl.textContent = f.name;
    fileSizeEl.textContent = formatSize(f.size);
    fileInfo.classList.add('visible');
    btnParse.disabled = false;
    parseMsg.className = 'message';
    trace(`<span class="trace-info">File selected: ${f.name} (${formatSize(f.size)})</span>`);
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
}

// ══════════════════════════════════════════════════════════════════
// PARSE
// ══════════════════════════════════════════════════════════════════
btnParse.addEventListener('click', async () => {
    if (!selectedFile) return;

    btnParse.disabled = true;
    btnParse.innerHTML = '<span class="spinner-inline"></span>Parsing...';
    parseMsg.className = 'message';
    resultsCard.style.display = 'none';

    const url = `${getApiUrl()}/api/d365taskrecorder/upload`;
    const formData = new FormData();
    formData.append('file', selectedFile);

    traceRequest('POST', url);
    const t0 = performance.now();

    try {
        const resp = await fetch(url, { method: 'POST', body: formData });
        const dur = Math.round(performance.now() - t0);
        const text = await resp.text();

        if (resp.ok) {
            const lines = text.split('\n').length;
            traceResponse(resp.status, dur, `${text.length} chars, ${lines} lines`);

            lastMarkdown = text;
            showResults(text);

            parseMsg.textContent = `Parsed successfully in ${dur}ms`;
            parseMsg.className = 'message visible success';
        } else {
            traceResponse(resp.status, dur, text.substring(0, 200));
            parseMsg.textContent = `Error: ${text}`;
            parseMsg.className = 'message visible error';
        }
    } catch (err) {
        const dur = Math.round(performance.now() - t0);
        traceResponse(0, dur, err.message);
        parseMsg.textContent = `Request failed: ${err.message}`;
        parseMsg.className = 'message visible error';
    } finally {
        btnParse.disabled = false;
        btnParse.textContent = 'Parse Recording';
    }
});

// ══════════════════════════════════════════════════════════════════
// RESULTS
// ══════════════════════════════════════════════════════════════════
function showResults(markdown) {
    // Raw
    outputRaw.textContent = markdown;

    // Rendered
    outputRendered.innerHTML = marked.parse(markdown);

    // Stats (extract from markdown)
    const nameMatch = markdown.match(/^# Task Recording: (.+)$/m);
    const stepsMatch = markdown.match(/\*\*Total User Actions\*\* \| (\d+)/);
    const formsMatch = markdown.match(/## Forms Visited[\s\S]*?\n(\|[^\n]*\n){2}((?:\|[^\n]*\n)*)/);
    const secMatch = markdown.match(/## Security Roles[\s\S]*?\n(\|[^\n]*\n){2}((?:\|[^\n]*\n)*)/);

    document.getElementById('statName').textContent = nameMatch ? nameMatch[1] : '-';
    document.getElementById('statSteps').textContent = stepsMatch ? stepsMatch[1] : '0';

    // Count form rows (lines starting with | and a digit)
    let formCount = 0;
    if (formsMatch && formsMatch[2]) {
        formCount = formsMatch[2].trim().split('\n').filter(l => l.startsWith('|')).length;
    }
    document.getElementById('statForms').textContent = formCount;

    // Count security rows
    let secCount = 0;
    if (secMatch && secMatch[2]) {
        secCount = secMatch[2].trim().split('\n').filter(l => l.startsWith('|')).length;
    }
    document.getElementById('statSecurity').textContent = secCount;

    resultsCard.style.display = 'block';
    resultsCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── Tabs ────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
});

// ── Copy / Download ─────────────────────────────────────────────
btnCopy.addEventListener('click', () => {
    navigator.clipboard.writeText(lastMarkdown).then(() => {
        btnCopy.textContent = 'Copied!';
        setTimeout(() => { btnCopy.textContent = 'Copy Markdown'; }, 1500);
    });
});

btnDownload.addEventListener('click', () => {
    const name = (selectedFile?.name || 'recording').replace(/\.axtr$/i, '') + '.md';
    const blob = new Blob([lastMarkdown], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
